overlays:
  Plex:
    overlay:
      name: plex
      url: https://raw.githubusercontent.com/s0len/meta-manager-config/main/overlays/network-top-left/Plex.png
      group: ICONS
      weight: 100
    plex_all: true

  # Networks below are either missing from Kometa's network defaults or, for
  # the Sky family, folded into the generic Sky overlay there. Entries share
  # Kometa's "networks" overlay group with a higher weight (defaults use 10)
  # so the specific artwork wins over a generic match.
